[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskgenie"
version = "0.1.0"
description = "TaskGenie: Production-grade Model Context Protocol (MCP) server for Android automation using uiautomator2"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp==2.13.0",
    "uiautomator2>=3.5.0",
    "uiautodev>=0.13.4",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0"
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/taskgenie"]
